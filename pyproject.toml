[project]
name = "voice-typer"
version = "0.1.0"
description = "Georgian voice dictation for Windows — speak, and the text appears wherever the cursor is"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
