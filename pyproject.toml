[project]
name = "voice-typer"
version = "0.1.5-beta.2"
description = "Georgian voice dictation for Windows and macOS — speak, and the text appears wherever the cursor is"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Without this, only `python -m pytest` works: that form puts the current directory on
# the import path, while a bare `pytest` does not — so every test importing voice_typer
# failed on CI while passing on the developer's machine.
pythonpath = ["."]
