name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    # Windows, because this is a Windows desktop app — pynput and sounddevice
    # need a real Windows environment to import at all.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        # No microphone and no clipboard on a CI runner — the suite covers pure
        # logic only, and the ElevenLabs client is mocked, so nothing is spent.
        env:
          ELEVENLABS_API_KEY: test-key-not-real
        run: pytest -q
